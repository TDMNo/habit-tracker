name: Update Backend Lockfile

on:
  push:
    branches:
      - feature/backend-foundation

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/backend-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Refresh package-lock.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile when changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: refresh backend dependency lockfile"
          git push origin HEAD:feature/backend-foundation
