name: Habit Tracker CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: habit-tracker-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required project documentation
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f PROJECT_INSTRUCTIONS.md
          test -f ARCHITECTURE.md
          test -f DEPLOYMENT.md
          test -f INFRASTRUCTURE.md

      - name: Validate operations shell syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n scripts/deploy-prod.sh
          bash -n scripts/backup-postgres.sh
          bash -n scripts/verify-backup-restore.sh

      - name: Verify production safety lock
        shell: bash
        run: |
          set -Eeuo pipefail
          target_sha="$(git rev-parse HEAD)"
          output="$(TARGET_SHA="$target_sha" SOURCE_DIR="$GITHUB_WORKSPACE" PROD_DIR="$GITHUB_WORKSPACE" PROD_LOCK_FILE="$RUNNER_TEMP/nonexistent-prod-lock" bash scripts/deploy-prod.sh)"
          echo "$output"
          grep -q '^PROD_LOCKED:' <<< "$output"
          test ! -e "$RUNNER_TEMP/nonexistent-prod-lock"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

  backend-smoke:
    name: PostgreSQL, migrations, auth and API smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: habit_tracker_ci
          POSTGRES_USER: habit_tracker_ci
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U habit_tracker_ci -d habit_tracker_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: production
      APP_BIND_ADDRESS: 127.0.0.1
      APP_PORT: 3100
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: habit_tracker_ci
      PGUSER: habit_tracker_ci
      PGPASSWORD: ci-postgres-password
      SESSION_SECRET: ci-only-session-secret-0123456789abcdef
      COOKIE_SECURE: "false"
      TRUST_PROXY: "false"
      ADMIN_LOGIN: ci-admin
      ADMIN_PASSWORD: CI-only-Strong-Password-123!
      ADMIN_DISPLAY_NAME: CI Admin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Build application
        run: npm run build

      - name: Apply migrations
        run: node dist/migrate.cjs

      - name: Create CI admin
        run: node dist/create-admin.cjs

      - name: Start production server
        shell: bash
        run: |
          node dist/server.cjs > /tmp/habit-tracker.log 2>&1 &
          echo $! > /tmp/habit-tracker.pid

      - name: Wait for health
        shell: bash
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3100/api/health | grep -q '"status":"ok"'; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/habit-tracker.log
          exit 1

      - name: Verify habit create edit history and archive API
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsS -c /tmp/cookies.txt \
            -H 'Content-Type: application/json' \
            -d '{"login":"ci-admin","password":"CI-only-Strong-Password-123!"}' \
            http://127.0.0.1:3100/api/auth/login | grep -q '"login":"ci-admin"'
          curl -fsS -b /tmp/cookies.txt \
            http://127.0.0.1:3100/api/auth/me | grep -q '"login":"ci-admin"'

          habit_id='11111111-1111-4111-8111-111111111111'
          payload='{"id":"11111111-1111-4111-8111-111111111111","title":"Offline walk","emoji":"🚶","type":"duration","color":"lime","target":20,"unit":"мин","startDate":"2026-09-11"}'
          curl -fsS -b /tmp/cookies.txt -H 'Content-Type: application/json' -d "$payload" \
            http://127.0.0.1:3100/api/habits | grep -q '"id":"11111111-1111-4111-8111-111111111111"'
          curl -fsS -b /tmp/cookies.txt -H 'Content-Type: application/json' -d "$payload" \
            http://127.0.0.1:3100/api/habits | grep -q '"id":"11111111-1111-4111-8111-111111111111"'

          curl -fsS -X PATCH -b /tmp/cookies.txt -H 'Content-Type: application/json' \
            -d '{"title":"Evening walk","emoji":"🚶","color":"lime"}' \
            "http://127.0.0.1:3100/api/habits/$habit_id" | grep -q '"title":"Evening walk"'
          curl -fsS -X PUT -b /tmp/cookies.txt -H 'Content-Type: application/json' \
            -d '{"effectiveFrom":"2026-09-12","target":30,"unit":"мин"}' \
            "http://127.0.0.1:3100/api/habits/$habit_id/target" | grep -q '"target":30'

          curl -fsS -b /tmp/cookies.txt 'http://127.0.0.1:3100/api/habits?date=2026-09-11' > /tmp/habits-before.json
          curl -fsS -b /tmp/cookies.txt 'http://127.0.0.1:3100/api/habits?date=2026-09-12' > /tmp/habits-after.json
          node -e "const d=JSON.parse(require('fs').readFileSync('/tmp/habits-before.json','utf8')); const h=d.habits.filter(h=>h.id==='$habit_id'); if(h.length!==1||h[0].title!=='Evening walk'||h[0].target!==20) process.exit(1)"
          node -e "const d=JSON.parse(require('fs').readFileSync('/tmp/habits-after.json','utf8')); const h=d.habits.find(h=>h.id==='$habit_id'); if(!h||h.target!==30) process.exit(1)"

          archive='{"archivedOn":"2026-09-13"}'
          curl -fsS -X PUT -b /tmp/cookies.txt -H 'Content-Type: application/json' -d "$archive" \
            "http://127.0.0.1:3100/api/habits/$habit_id/archive" | grep -q '"archivedOn":"2026-09-13"'
          curl -fsS -X PUT -b /tmp/cookies.txt -H 'Content-Type: application/json' -d "$archive" \
            "http://127.0.0.1:3100/api/habits/$habit_id/archive" | grep -q '"archivedOn":"2026-09-13"'
          curl -fsS -b /tmp/cookies.txt 'http://127.0.0.1:3100/api/habits?date=2026-09-13' > /tmp/habits-archived.json
          node -e "const d=JSON.parse(require('fs').readFileSync('/tmp/habits-archived.json','utf8')); if(d.habits.some(h=>h.id==='$habit_id')) process.exit(1)"

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/habit-tracker.log || true

      - name: Stop server
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/habit-tracker.pid ]]; then
            kill "$(cat /tmp/habit-tracker.pid)" 2>/dev/null || true
          fi

  production-stack-smoke:
    name: Production Compose, backup and restore smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare isolated production-like environment
        shell: bash
        run: |
          set -Eeuo pipefail
          DATA_DIR="$RUNNER_TEMP/habit-tracker-postgres"
          BACKUP_DIR="$RUNNER_TEMP/habit-tracker-backups"
          mkdir -p "$DATA_DIR" "$BACKUP_DIR"
          cat > .env.ci-production <<EOF
          POSTGRES_DB=habit_tracker_ci_prod
          POSTGRES_USER=habit_tracker_ci_prod
          POSTGRES_PASSWORD=ci-compose-postgres-password
          POSTGRES_DATA_DIR=$DATA_DIR
          POSTGRES_BACKUP_DIR=$BACKUP_DIR
          SESSION_SECRET=ci-compose-session-secret-0123456789abcdef
          HOST_PORT=3199
          COOKIE_SECURE=false
          TRUST_PROXY=false
          EOF
          docker compose --env-file .env.ci-production -f docker-compose.prod.yml config --quiet

      - name: Build application image
        run: docker compose --env-file .env.ci-production -f docker-compose.prod.yml build app

      - name: Start PostgreSQL and migrate
        shell: bash
        run: |
          set -Eeuo pipefail
          docker compose --env-file .env.ci-production -f docker-compose.prod.yml up -d postgres
          for i in {1..30}; do
            status="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{end}}' habit_tracker_prod_postgres 2>/dev/null || true)"
            [[ "$status" == "healthy" ]] && break
            sleep 1
          done
          [[ "$(docker inspect -f '{{.State.Health.Status}}' habit_tracker_prod_postgres)" == "healthy" ]]
          docker compose --env-file .env.ci-production -f docker-compose.prod.yml run --rm --no-deps app node dist/migrate.cjs

      - name: Create account and start app
        shell: bash
        run: |
          set -Eeuo pipefail
          docker compose --env-file .env.ci-production -f docker-compose.prod.yml run --rm --no-deps \
            -e ADMIN_LOGIN=ci-admin -e ADMIN_PASSWORD='CI-only-Strong-Password-123!' -e ADMIN_DISPLAY_NAME='CI Admin' \
            app node dist/create-admin.cjs
          docker compose --env-file .env.ci-production -f docker-compose.prod.yml up -d --no-deps app
          for i in {1..45}; do
            if curl -fsS http://127.0.0.1:3199/api/health | grep -q '"status":"ok"'; then
              exit 0
            fi
            sleep 1
          done
          docker compose --env-file .env.ci-production -f docker-compose.prod.yml logs app
          exit 1

      - name: Exercise API before backup
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsS -c /tmp/prod-cookies.txt \
            -H 'Content-Type: application/json' \
            -d '{"login":"ci-admin","password":"CI-only-Strong-Password-123!"}' \
            http://127.0.0.1:3199/api/auth/login | grep -q '"login":"ci-admin"'
          curl -fsS -b /tmp/prod-cookies.txt \
            -H 'Content-Type: application/json' \
            -d '{"title":"CI walk","emoji":"🚶","type":"duration","color":"lime","target":20,"unit":"мин","startDate":"2026-09-11"}' \
            http://127.0.0.1:3199/api/habits | grep -q '"title":"CI walk"'

      - name: Create and restore-verify backup
        shell: bash
        run: |
          set -Eeuo pipefail
          output="$(PROD_DIR="$GITHUB_WORKSPACE" ENV_FILE="$GITHUB_WORKSPACE/.env.ci-production" COMPOSE_FILE="$GITHUB_WORKSPACE/docker-compose.prod.yml" bash scripts/backup-postgres.sh)"
          echo "$output"
          backup_file="${output#BACKUP_OK }"
          test -s "$backup_file"
          test -s "$backup_file.sha256"
          PROD_DIR="$GITHUB_WORKSPACE" ENV_FILE="$GITHUB_WORKSPACE/.env.ci-production" COMPOSE_FILE="$GITHUB_WORKSPACE/docker-compose.prod.yml" BACKUP_FILE="$backup_file" \
            bash scripts/verify-backup-restore.sh

      - name: Show Compose logs on failure
        if: failure()
        run: docker compose --env-file .env.ci-production -f docker-compose.prod.yml logs || true

      - name: Stop isolated stack
        if: always()
        run: docker compose --env-file .env.ci-production -f docker-compose.prod.yml down --remove-orphans || true
