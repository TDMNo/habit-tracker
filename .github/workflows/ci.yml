name: Habit Tracker CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: habit-tracker-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Validate project and build when modern app exists
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required project documentation
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f PROJECT_INSTRUCTIONS.md
          test -f ARCHITECTURE.md
          test -f DEPLOYMENT.md
          test -f INFRASTRUCTURE.md

      - name: Detect modern application
        id: app
        shell: bash
        run: |
          if [[ -f package.json && -f package-lock.json ]]; then
            echo "modern=true" >> "$GITHUB_OUTPUT"
            echo "Modern Node application detected"
          else
            echo "modern=false" >> "$GITHUB_OUTPUT"
            echo "Bootstrap mode: legacy prototype remains, no production build is attempted"
          fi

      - name: Setup Node.js
        if: steps.app.outputs.modern == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        if: steps.app.outputs.modern == 'true'
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        if: steps.app.outputs.modern == 'true'
        run: npm run typecheck --if-present

      - name: Tests
        if: steps.app.outputs.modern == 'true'
        run: npm test --if-present

      - name: Production build
        if: steps.app.outputs.modern == 'true'
        run: npm run build --if-present
