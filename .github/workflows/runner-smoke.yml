name: Habit Tracker Runner Smoke

on:
  push:
    branches:
      - infra/autodeploy-bootstrap

permissions:
  contents: read

jobs:
  runner-smoke:
    name: Verify docker-home runner
    runs-on:
      - self-hosted
      - linux
      - x64
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate runner host
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "hostname=$(hostname)"
          echo "user=$(whoami)"
          test "$(hostname)" = "docker-home"
          test "$(whoami)" = "leo"
          docker version >/dev/null
          docker compose version >/dev/null
          test -d /opt/stacks/habit-tracker/.git
          test -z "$(git -C /opt/stacks/habit-tracker status --porcelain)"
          git -C /opt/stacks/habit-tracker remote get-url origin
          echo "RUNNER_SMOKE_OK"
